name: StormBrowser - Publish Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Release Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npm run build:win --workspace=browser -- --publish never

      - name: Build Windows setup
        run: npm run build --workspace=setup -- --publish never

      - name: Upload Windows browser files
        uses: actions/upload-artifact@v4
        with:
          name: StormBrowser-Windows
          path: browser/dist/*
          if-no-files-found: error

      - name: Upload Windows setup file
        uses: actions/upload-artifact@v4
        with:
          name: StormBrowser-Setup-Windows
          path: setup/dist/*
          if-no-files-found: error

  release-linux:
    name: Release Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Build Linux
        run: npm run build:linux --workspace=browser -- --publish never

      - name: Upload Linux files
        uses: actions/upload-artifact@v4
        with:
          name: StormBrowser-Linux
          path: browser/dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - release-windows
      - release-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Windows builds
        uses: actions/download-artifact@v4
        with:
          name: StormBrowser-Windows
          path: release/windows/browser

      - name: Download Windows setup
        uses: actions/download-artifact@v4
        with:
          name: StormBrowser-Setup-Windows
          path: release/windows/setup

      - name: Download Linux builds
        uses: actions/download-artifact@v4
        with:
          name: StormBrowser-Linux
          path: release/linux/browser

      - name: Read package version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="v$VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "Release tag $TAG does not match package version v$VERSION" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            release/windows/browser/*
            release/windows/setup/StormBrowser-Setup.exe
            release/linux/browser/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}