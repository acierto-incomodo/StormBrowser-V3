name: StormBrowser - Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npm run build:win --workspace=browser -- --publish never

      - name: Build Windows setup
        run: npm run build --workspace=setup -- --publish never

      - name: Upload Windows browser artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StormBrowser-Windows
          path: browser/dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: StormBrowser-Setup-Windows
          path: setup/dist/*
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Install dependencies
        run: npm ci

      - name: Build Linux
        run: npm run build:linux --workspace=browser -- --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StormBrowser-Linux
          path: browser/dist/*
          if-no-files-found: error
          retention-days: 14