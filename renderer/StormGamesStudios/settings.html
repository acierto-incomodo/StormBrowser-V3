<!DOCTYPE html>
<html lang="en">
<head>
  <script>const { ipcRenderer } = require('electron');</script>
  <meta charset="UTF-8">
  <title id="page-title">Settings - StormBrowser</title>
  <link rel="stylesheet" href="./../style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-base);
    }
    .settings-container {
      width: 100%;
      max-width: 500px;
      padding: 24px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }
    h1 { margin-bottom: 16px; color: var(--accent); font-weight: 500; font-size: 22px; }
    h2 { font-size: 16px; margin-top: 24px; color: var(--text-primary); }
    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }
    .setting-info { display: flex; flex-direction: column; gap: 4px; }
    .setting-title { color: var(--text-primary); font-weight: 500; }
    .setting-desc { color: var(--text-secondary); font-size: 12px; }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
    select { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); padding: 4px 8px; border-radius: 4px; outline: none; }
    .shortcuts-editor { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .shortcut-row { display: flex; gap: 8px; align-items: center; background: var(--bg-elevated); padding: 8px; border-radius: var(--radius-sm); }
    .shortcut-row input { flex: 1; background: transparent; border: 1px solid var(--border); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    .btn-del { color: #f87171; cursor: pointer; background: none; border: none; font-size: 16px; }
    .btn-add { margin-top: 8px; padding: 6px; background: var(--accent-soft); color: var(--accent); border: 1px dashed var(--accent); border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-add:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="settings-container">
    <h1 id="txt-settings">Ajustes</h1>
    
    <!-- Configuraciones Generales -->
    <div class="setting-item">
      <div class="setting-info">
        <span class="setting-title" id="txt-lang-title">Idioma</span>
        <span class="setting-desc" id="txt-lang-desc">Selecciona el idioma de la interfaz.</span>
      </div>
      <select id="select-lang">
        <option value="system">System Default</option>
        <option value="en">English</option>
        <option value="es">Castellano</option>
        <option value="eu">Euskara</option>
      </select>
    </div>
    <div class="setting-item">
      <div class="setting-info">
        <span class="setting-title" id="txt-remember-title">Recordar pestañas</span>
        <span class="setting-desc" id="txt-remember-desc">Restaurar las pestañas abiertas al iniciar el navegador.</span>
      </div>
      <input type="checkbox" id="check-remember-tabs">
    </div>
    <div class="setting-item">
      <div class="setting-info">
        <span class="setting-title" id="txt-confirm-title">Confirmar al cerrar</span>
        <span class="setting-desc" id="txt-confirm-desc">Preguntar si se desea guardar la sesión al salir.</span>
      </div>
      <input type="checkbox" id="check-confirm-close">
    </div>

    <!-- Editor de Shortcuts -->
    <h2 id="txt-shortcuts-title">Accesos Directos (Máx 8)</h2>
    <div id="shortcuts-list" class="shortcuts-editor"></div>
    <button id="add-shortcut" class="btn-add">+ Añadir Acceso Directo</button>
  </div>

  <script>
    const rememberCheck = document.getElementById('check-remember-tabs');
    const confirmCheck = document.getElementById('check-confirm-close');
    const langSelect = document.getElementById('select-lang');
    const shortcutsList = document.getElementById('shortcuts-list');
    const addBtn = document.getElementById('add-shortcut');
    let currentShortcuts = [];
    
    // Cargar valores actuales
    const settings = JSON.parse(localStorage.getItem('storm_settings') || '{"remember":false,"confirm":true,"language":"system"}');
    rememberCheck.checked = settings.remember;
    confirmCheck.checked = settings.confirm;
    langSelect.value = settings.language || 'system';

    // Aplicar traducciones
    ipcRenderer.invoke('get-translations', settings.language).then(({ data }) => {
      document.getElementById('page-title').textContent = data.settings + " - StormBrowser";
      document.getElementById('txt-settings').textContent = data.settings;
      document.getElementById('txt-lang-title').textContent = data.settings_language;
      document.getElementById('txt-lang-desc').textContent = data.settings_language_desc;
      document.getElementById('txt-remember-title').textContent = data.settings_remember_tabs;
      document.getElementById('txt-remember-desc').textContent = data.settings_remember_tabs_desc;
      document.getElementById('txt-confirm-title').textContent = data.settings_confirm_close;
      document.getElementById('txt-confirm-desc').textContent = data.settings_confirm_close_desc;
      langSelect.options[0].textContent = data.system_default;
      document.getElementById('txt-shortcuts-title').textContent = data.shortcuts_title || "Accesos Directos (Máx 8)";
    });

    async function loadShortcuts() {
      currentShortcuts = await ipcRenderer.invoke('get-shortcuts');
      renderShortcuts();
    }

    function renderShortcuts() {
      shortcutsList.innerHTML = '';
      currentShortcuts.forEach((s, i) => {
        const row = document.createElement('div');
        row.className = 'shortcut-row';
        row.innerHTML = `
          <input type="text" value="${s.name}" placeholder="Nombre" onchange="updateShortcut(${i}, 'name', this.value)">
          <input type="text" value="${s.url}" placeholder="URL" onchange="updateShortcut(${i}, 'url', this.value)">
          <button class="btn-del" onclick="removeShortcut(${i})">×</button>
        `;
        shortcutsList.appendChild(row);
      });
      addBtn.disabled = currentShortcuts.length >= 8;
    }

    window.updateShortcut = (idx, key, val) => {
      currentShortcuts[idx][key] = val;
      saveShortcuts();
    };

    window.removeShortcut = (idx) => {
      currentShortcuts.splice(idx, 1);
      renderShortcuts();
      saveShortcuts();
    };

    addBtn.onclick = () => {
      if (currentShortcuts.length < 8) {
        currentShortcuts.push({ name: 'Nuevo', url: 'https://' });
        renderShortcuts();
        saveShortcuts();
      }
    };

    async function saveShortcuts() {
      await ipcRenderer.invoke('save-shortcuts', currentShortcuts);
    }

    // Guardar cambios
    const save = () => {
      localStorage.setItem('storm_settings', JSON.stringify({
        remember: rememberCheck.checked,
        confirm: confirmCheck.checked,
        language: langSelect.value
      }));
      if (confirm('Reabrir pestaña para aplicar cambios / Reopen tab to apply changes?')) location.reload();
    };

    rememberCheck.addEventListener('change', save);
    confirmCheck.addEventListener('change', save);
    langSelect.addEventListener('change', save);

    loadShortcuts();
  </script>
</body>
</html>
