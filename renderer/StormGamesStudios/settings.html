<!DOCTYPE html>
<html lang="en">
<head>
  <script>const { ipcRenderer } = require('electron');</script>
  <meta charset="UTF-8">
  <title id="page-title">Settings - StormBrowser</title>
  <link rel="stylesheet" href="./../style.css">
  <style>
    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: var(--bg-base);
      padding: 40px 0;
      overflow-y: auto;
    }
    .settings-container {
      width: 100%;
      max-width: 500px;
      padding: 24px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }
    h1 { margin-bottom: 16px; color: var(--accent); font-weight: 500; font-size: 22px; }
    h2 { font-size: 16px; margin-top: 24px; color: var(--text-primary); }
    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }
    .setting-info { display: flex; flex-direction: column; gap: 4px; }
    .setting-title { color: var(--text-primary); font-weight: 500; }
    .setting-desc { color: var(--text-secondary); font-size: 12px; }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
    select, input[type="text"] { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); padding: 6px 10px; border-radius: 4px; outline: none; }
    .shortcuts-editor { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .shortcut-row { display: grid; grid-template-columns: 1fr 2fr auto; gap: 8px; align-items: center; background: var(--bg-elevated); padding: 8px; border-radius: var(--radius-sm); border: 1px solid transparent; }
    .shortcut-row.active { border-color: var(--accent); }
    .btn-save { margin-top: 32px; width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: var(--radius-md); cursor: pointer; font-weight: 600; }
    .search-engines-mgr { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .add-engine-form { display: grid; grid-template-columns: 1fr 2fr auto; gap: 5px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="settings-container">
    <h1 id="txt-settings">Ajustes</h1>
    
    <!-- Configuraciones Generales -->
    <div class="setting-item">
      <div class="setting-info">
        <span class="setting-title" id="txt-lang-title">Idioma</span>
        <span class="setting-desc" id="txt-lang-desc">Selecciona el idioma de la interfaz.</span>
      </div>
      <select id="select-lang">
        <option value="system">System Default</option>
        <option value="en">English</option>
        <option value="es">Castellano</option>
        <option value="eu">Euskara</option>
      </select>
    </div>
    <div class="setting-item">
      <div class="setting-info">
        <span class="setting-title" id="txt-remember-title">Recordar pestañas</span>
        <span class="setting-desc" id="txt-remember-desc">Restaurar las pestañas abiertas al iniciar el navegador.</span>
      </div>
      <input type="checkbox" id="check-remember-tabs">
    </div>
    <div class="setting-item">
      <div class="setting-info">
        <span class="setting-title" id="txt-confirm-title">Confirmar al cerrar</span>
        <span class="setting-desc" id="txt-confirm-desc">Preguntar si se desea guardar la sesión al salir.</span>
      </div>
      <input type="checkbox" id="check-confirm-close">
    </div>
    <div class="setting-item">
      <div class="setting-info">
        <span class="setting-title" id="txt-search-title">Motor de Búsqueda</span>
        <span class="setting-desc" id="txt-search-desc">Selecciona o añade motores de búsqueda.</span>
      </div>
      <select id="select-search-engine"></select>
    </div>
    <div class="search-engines-mgr">
      <div class="add-engine-form">
        <input type="text" id="new-engine-name" placeholder="Google">
        <input type="text" id="new-engine-url" placeholder="https://google.com/search?q=">
        <button id="btn-add-engine" style="background:var(--accent); border:none; color:white; padding:0 10px; border-radius:4px; cursor:pointer;">+</button>
      </div>
    </div>

    <!-- Editor de Shortcuts -->
    <h2 id="txt-shortcuts-title">Accesos Directos (8 slots)</h2>
    <div id="shortcuts-list" class="shortcuts-editor"></div>

    <button id="btn-save-all" class="btn-save">Guardar Cambios</button>
  </div>

  <script>
    const rememberCheck = document.getElementById('check-remember-tabs');
    const confirmCheck = document.getElementById('check-confirm-close');
    const langSelect = document.getElementById('select-lang');
    const shortcutsList = document.getElementById('shortcuts-list');
    const searchSelect = document.getElementById('select-search-engine');
    const btnSaveAll = document.getElementById('btn-save-all');
    let currentShortcuts = [];
    let customEngines = [];
    
    // Cargar valores actuales
    ipcRenderer.invoke('get-settings').then(data => {
      currentSettings = data;
      rememberCheck.checked = currentSettings.remember;
      confirmCheck.checked = currentSettings.confirm;
      langSelect.value = currentSettings.language || 'system';
      
      // Cargar traducciones una vez tenemos el idioma de los ajustes
      return ipcRenderer.invoke('get-translations', currentSettings.language);
    }).then(({ data }) => {
      document.getElementById('page-title').textContent = data.settings + " - StormBrowser";
      document.getElementById('txt-settings').textContent = data.settings;
      document.getElementById('txt-lang-title').textContent = data.settings_language;
      document.getElementById('txt-lang-desc').textContent = data.settings_language_desc;
      document.getElementById('txt-remember-title').textContent = data.settings_remember_tabs;
      document.getElementById('txt-remember-desc').textContent = data.settings_remember_tabs_desc;
      document.getElementById('txt-confirm-title').textContent = data.settings_confirm_close;
      document.getElementById('txt-confirm-desc').textContent = data.settings_confirm_close_desc;
      document.getElementById('txt-search-title').textContent = data.settings_search_engine || "Motor de búsqueda";
      document.getElementById('txt-search-desc').textContent = data.settings_search_desc || "URL base para búsquedas.";
      langSelect.options[0].textContent = data.system_default;
    });

    async function initEngines() {
      const activeUrl = await ipcRenderer.invoke('get-search-engine');
      customEngines = await ipcRenderer.invoke('get-custom-search-engines');
      const defaults = [ {name: "Google", url: "https://www.google.com/search?q="} ];
      
      searchSelect.innerHTML = '';
      [...defaults, ...customEngines].forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.url;
        opt.textContent = e.name;
        if (e.url === activeUrl) opt.selected = true;
        searchSelect.appendChild(opt);
      });
    }

    document.getElementById('btn-add-engine').onclick = async () => {
      const name = document.getElementById('new-engine-name').value;
      const url = document.getElementById('new-engine-url').value;
      if (name && url) {
        customEngines.push({ name, url });
        await ipcRenderer.invoke('save-custom-search-engines', customEngines);
        initEngines();
      }
    };

    async function loadShortcuts() {
      const data = await ipcRenderer.invoke('get-shortcuts');
      currentShortcuts = Array(8).fill().map((_, i) => data[i] || { name: '', url: 'https://', icon: null });
      renderShortcuts();
    }

    function renderShortcuts() {
      shortcutsList.innerHTML = '';
      currentShortcuts.forEach((s, i) => {
        const row = document.createElement('div');
        row.className = 'shortcut-row';
        row.innerHTML = `
          <input type="text" value="${s.name}" placeholder="Slot ${i+1}" onchange="currentShortcuts[${i}].name = this.value; currentShortcuts[${i}].icon=null">
          <input type="text" value="${s.url}" placeholder="URL" onchange="currentShortcuts[${i}].url = this.value; currentShortcuts[${i}].icon=null">
          <div style="width:16px; height:16px; background:${s.icon?'var(--accent)':'var(--text-muted)'}; border-radius:50%"></div>
        `;
        shortcutsList.appendChild(row);
      });
    }

    btnSaveAll.onclick = async () => {
      currentSettings = {
        remember: rememberCheck.checked,
        confirm: confirmCheck.checked,
        language: langSelect.value
      };
      await ipcRenderer.invoke('save-settings', currentSettings);
      await ipcRenderer.invoke('save-search-engine', searchSelect.value);
      await ipcRenderer.invoke('save-shortcuts', currentShortcuts.filter(s => s.name && s.url !== 'https://'));
      
      if (confirm('Reabrir pestaña para aplicar cambios / Reopen tab to apply changes?')) location.reload();
    };

    loadShortcuts();
    initEngines();
  </script>
</body>
</html>
