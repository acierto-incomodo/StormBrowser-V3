<!DOCTYPE html>
<html lang="en">
<head>
  <script>const { ipcRenderer } = require('electron');</script>
  <meta charset="UTF-8">
  <title id="page-title">About StormBrowser</title>
  <link rel="stylesheet" href="./../style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-base);
      user-select: text;
    }
    .info-container {
      max-width: 500px;
      text-align: center;
      padding: 40px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }
    h1 { margin-bottom: 20px; color: var(--accent); font-weight: 500; }
    p { color: var(--text-secondary); line-height: 1.6; margin-bottom: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="info-container">
    <h1 id="app-name">StormBrowser</h1>
    <p><span id="txt-version">Version</span> <span id="app-version">...</span></p>
    <p id="app-desc">Un navegador moderno y oscuro construido con Electron y Chromium.</p>
    <p id="app-dev">Desarrollado por StormGamesStudios.</p>
  </div>
  <script>
    const settings = JSON.parse(localStorage.getItem('storm_settings') || '{}');
    
    // La versión ya está disponible globalmente gracias al preload
    document.getElementById('app-version').textContent = window.APP_VERSION || '0.0.0';
    
    ipcRenderer.invoke('get-translations', settings.language).then(({ data }) => {
      document.getElementById('page-title').textContent = data.about_title;
      document.getElementById('app-name').textContent = data.app_name;
      document.getElementById('txt-version').textContent = data.version_text;
      document.getElementById('app-desc').textContent = data.about_desc;
      document.getElementById('app-dev').textContent = data.developed_by;
    });
  </script>
</body>
</html>
