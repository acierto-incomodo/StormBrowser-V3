<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>About StormBrowser</title>
  <link rel="stylesheet" href="./../style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-base);
      user-select: text;
    }
    .info-container {
      max-width: 500px;
      text-align: center;
      padding: 40px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }
    h1 { margin-bottom: 20px; color: var(--accent); font-weight: 500; }
    p { color: var(--text-secondary); line-height: 1.6; margin-bottom: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="info-container">
    <h1>StormBrowser</h1>
    <p>Version 1.0.0</p>
    <p>Un navegador moderno y oscuro construido con Electron y Chromium.</p>
    <p>Desarrollado por StormGamesStudios.</p>
  </div>
</body>
</html>
