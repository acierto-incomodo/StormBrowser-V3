<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Actualizando Storm Browser</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: var(--bg-base);
      margin: 0;
      font-family: 'Inter', sans-serif;
      -webkit-app-region: drag; /* Permite mover la ventana mientras actualiza */
      user-select: none;
      color: var(--text-primary);
    }
    .update-box {
      text-align: center;
      width: 80%;
      max-width: 360px;
      -webkit-app-region: no-drag;
    }
    .logo-anim { margin-bottom: 30px; animation: pulse 2s infinite ease-in-out; }
    @keyframes pulse { 0%, 100% { opacity: 0.8; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
    
    .progress-container {
      width: 100%;
      height: 6px;
      background: var(--bg-elevated);
      border-radius: 10px;
      margin: 24px 0 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    #progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--purple));
      transition: width 0.3s ease-out;
    }
    h2 { font-weight: 500; font-size: 20px; margin-bottom: 8px; letter-spacing: -0.5px; }
    p { color: var(--text-secondary); font-size: 14px; }
    #percent { color: var(--text-muted); font-size: 12px; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="update-box">
    <div class="logo-anim">
      <svg width="60" height="60" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="22" stroke="url(#grad-upd)" stroke-width="2.5"/>
        <path d="M24 8 L38 38 L24 32 L10 38 Z" fill="url(#grad-upd)"/>
        <defs><linearGradient id="grad-upd" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#6c8fff"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient></defs>
      </svg>
    </div>
    <h2>Actualizando Storm Browser</h2>
    <p id="status">Preparando la descarga...</p>
    <div class="progress-container"><div id="progress-bar"></div></div>
    <div id="percent">0%</div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const bar = document.getElementById('progress-bar');
    const percentText = document.getElementById('percent');
    const statusText = document.getElementById('status');

    ipcRenderer.on('download-progress', (event, percent) => {
      const p = Math.floor(percent);
      bar.style.width = p + '%';
      percentText.textContent = p + '%';
      statusText.textContent = 'Descargando nuevas funcionalidades...';
    });

    ipcRenderer.on('update-downloaded', () => {
      statusText.textContent = '¡Todo listo! Reiniciando...';
      bar.style.width = '100%';
      percentText.textContent = 'Completado';
      setTimeout(() => { ipcRenderer.send('install-update'); }, 2000);
    });
  </script>
</body>
</html>
