<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StormBrowser</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Title bar + tabs -->
    <div id="titlebar">
      <div id="tab-bar">
        <div id="tabs-container"></div>
        <button id="new-tab-btn" title="New tab">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path
              d="M7 1v12M1 7h12"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>

      <div id="window-controls">
        <button id="btn-settings" title="Settings">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
            ></path>
          </svg>
        </button>
        <button id="btn-info" title="Information">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
        </button>
        <button id="btn-min" title="Minimize">
          <svg width="10" height="2" viewBox="0 0 10 2">
            <rect width="10" height="1.5" rx="0.75" fill="currentColor" />
          </svg>
        </button>
        <button id="btn-max" title="Maximize">
          <svg width="10" height="10" viewBox="0 0 10 10">
            <rect
              x="0.75"
              y="0.75"
              width="8.5"
              height="8.5"
              rx="1.5"
              stroke="currentColor"
              stroke-width="1.5"
              fill="none"
            />
          </svg>
        </button>
        <button id="btn-close" title="Close">
          <svg width="10" height="10" viewBox="0 0 10 10">
            <path
              d="M1 1l8 8M9 1L1 9"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- Navigation bar -->
    <div id="navbar">
      <div id="nav-controls">
        <button class="nav-btn" id="btn-back" title="Back" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path
              d="M10 3L5 8l5 5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button class="nav-btn" id="btn-forward" title="Forward" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path
              d="M6 3l5 5-5 5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button class="nav-btn" id="btn-reload" title="Reload">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path
              d="M13.5 8A5.5 5.5 0 1 1 8 2.5c1.8 0 3.4.87 4.4 2.2"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path
              d="M12 2v3h-3"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>

      <div id="url-bar-wrapper">
        <div id="lock-icon">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <rect
              x="2"
              y="5.5"
              width="8"
              height="5.5"
              rx="1.2"
              stroke="currentColor"
              stroke-width="1.3"
            />
            <path
              d="M4 5.5V4a2 2 0 1 1 4 0v1.5"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <input
          type="text"
          id="url-bar"
          placeholder="Search or enter URL..."
          autocomplete="off"
          spellcheck="false"
        />
        <div id="loading-spinner" class="hidden"></div>
      </div>

      <div id="nav-actions">
        <button class="nav-btn" id="btn-home" title="Home">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path
              d="M2 7.5L8 2l6 5.5"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M4 6.5V13h3v-3h2v3h3V6.5"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- Update banner -->
    <div id="update-banner" class="hidden"></div>

    <!-- Exit confirmation modal -->
    <div id="modal-overlay" class="hidden">
      <div id="exit-modal">
        <h3>¿Cerrar StormBrowser?</h3>
        <p>
          Tienes varias pestañas abiertas. ¿Quieres guardarlas para la próxima
          vez?
        </p>
        <div class="modal-options">
          <label
            ><input type="checkbox" id="dont-ask-exit" /> No volver a
            preguntar</label
          >
        </div>
        <div class="modal-buttons">
          <button id="btn-exit-cancel">Cancelar</button>
          <button id="btn-exit-close">Solo cerrar</button>
          <button id="btn-exit-save" class="primary">Guardar y cerrar</button>
        </div>
      </div>
    </div>

    <!-- Webview container -->
    <div id="webview-container"></div>

    <!-- New tab page -->
    <div id="new-tab-page" class="hidden">
      <div id="ntp-content">
        <div id="ntp-logo">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <circle
              cx="24"
              cy="24"
              r="22"
              stroke="url(#grad)"
              stroke-width="2.5"
            />
            <path
              d="M24 8 L38 38 L24 32 L10 38 Z"
              fill="url(#grad)"
              opacity="0.9"
            />
            <defs>
              <linearGradient
                id="grad"
                x1="0"
                y1="0"
                x2="48"
                y2="48"
                gradientUnits="userSpaceOnUse"
              >
                <stop offset="0%" stop-color="#6c8fff" />
                <stop offset="100%" stop-color="#a78bfa" />
              </linearGradient>
            </defs>
          </svg>
          <span>StormBrowser</span>
        </div>
        <div id="ntp-search-wrapper">
          <input
            type="text"
            id="ntp-search"
            placeholder="Search the web or enter a URL..."
            autocomplete="off"
          />
          <button id="ntp-search-btn">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <circle
                cx="7.5"
                cy="7.5"
                r="5.5"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <path
                d="M11.5 11.5L16 16"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
        <div id="ntp-shortcuts"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
