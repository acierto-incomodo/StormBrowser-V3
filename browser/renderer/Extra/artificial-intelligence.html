<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artificial Intelligence - StormBrowser</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .back-button {
            position: fixed;
            top: 16px;
            left: 16px;
            width: auto;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            background: #1e1e2a;
            color: #8888a8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 10px;
            cursor: pointer;
        }
        .back-button:hover {
            color: #e8e8f0;
            border-color: #6c8fff55;
        }
    </style>
</head>
<body>
    <button class="back-button" id="back-button" title="Back" aria-label="Back">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span data-i18n="back">Back</span>
    </button>
    <script>
        const fs = require("fs");
        const path = require("path");

        async function loadLocale() {
            let settings = { language: "auto" };
            try {
                settings = JSON.parse(localStorage.getItem("storm-settings")) || settings;
            } catch (e) {}

            let lang = settings.language;
            if (!lang || lang === "auto") {
                const systemLanguage = await require("electron").ipcRenderer.invoke("get-app-locale");
                lang = systemLanguage.startsWith("es") ? "es" : systemLanguage.startsWith("eu") ? "eu" : "en";
            }

            try {
                const filePath = path.join(__dirname, "..", "assets", "lang", "artificial-intelligence", `${lang}.json`);
                const translations = JSON.parse(fs.readFileSync(filePath, "utf8"));
                document.querySelectorAll("[data-i18n]").forEach((element) => {
                    const key = element.getAttribute("data-i18n");
                    if (translations[key]) element.textContent = translations[key];
                });
            } catch (e) {
                console.error("Artificial Intelligence locale error:", e);
            }
        }

        loadLocale();
        document.getElementById("back-button").addEventListener("click", () => {
            window.parent.postMessage({ type: "navigate", url: "storm://extensions" }, "*");
        });
    </script>
</body>
</html>
